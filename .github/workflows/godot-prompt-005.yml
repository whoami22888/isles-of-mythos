name: Prompt 005 Vulkan Mobile shader regression

on:
  pull_request:
    paths:
      - ".github/workflows/godot-prompt-005.yml"
      - "client-godot/shaders/cel_stylized_pbr.gdshader"
      - "client-godot/shaders/cel_stylized_pbr_mobile.gdshader"
      - "client-godot/shaders/cel_stylized_pbr_shared.gdshaderinc"
      - "client-godot/tests/cel_stylized_pbr_shader_compile_test.gd"
      - "client-godot/tests/cel_stylized_pbr_shader_test.tscn"
      - "client-godot/tests/test_triplanar_normal_math.py"

permissions:
  contents: read

concurrency:
  group: prompt-005-vulkan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  shader:
    name: Godot 4.7.2 Vulkan Mobile shader regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          install "$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          "$RUNNER_TEMP/godot/godot" --version | grep -F "4.7.2.stable"

      - name: Run triplanar normal reference regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s client-godot/tests -p "test_triplanar_normal_math.py"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/godot" --headless --editor --path client-godot --quit --import

      - name: Install software Vulkan dependencies
        shell: bash
        run: |
          set -euo pipefail

          mirror_file=/etc/apt/apt-mirrors.txt
          if [ ! -s "$mirror_file" ]; then
            echo "::error::Expected Ubuntu runner apt mirror list is missing."
            exit 1
          fi

          # Regression-check HTTP/HTTPS and trailing-slash variants from runner images.
          for sample_uri in 'http://us-east-2.ec2.archive.ubuntu.com/ubuntu' 'http://us-east-2.ec2.archive.ubuntu.com/ubuntu/' 'https://us-east-2.ec2.archive.ubuntu.com/ubuntu' 'https://us-east-2.ec2.archive.ubuntu.com/ubuntu/'; do
            expected_uri='https://archive.ubuntu.com/ubuntu'
            rewritten_uri="$(printf '%s\n' "$sample_uri" | sed -E 's|https?://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu|g')"
            if [ "$rewritten_uri" != "$expected_uri" ]; then
              echo "::error::Ubuntu regional mirror rewrite regression: $rewritten_uri"
              exit 1
            fi
          done

          echo "APT mirror list before rewrite:"
          cat "$mirror_file"
          sudo sed -E -i 's|https?://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu|g' "$mirror_file"
          echo "APT mirror list after rewrite:"
          cat "$mirror_file"

          if grep -Eq 'https?://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu/?' "$mirror_file"; then
            echo "::error::A regional EC2 Ubuntu mirror remains in apt-mirrors.txt."
            exit 1
          fi
          if ! grep -Eq 'https?://archive\.ubuntu\.com/ubuntu/?' "$mirror_file"; then
            echo "::error::Official Ubuntu archive mirror is not configured in apt-mirrors.txt."
            exit 1
          fi

          # Also rewrite any direct regional mirror URI if the runner stops using mirror+file.
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source_file" ]; then
              sudo sed -E -i 's|https?://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done

          command -v xvfb-run >/dev/null
          command -v xauth >/dev/null

          # Preserve the 180s hard cap and bound each HTTP(S) request.
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --no-install-recommends -y mesa-vulkan-drivers

          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lvp_icd" ]; then
            echo "::error::Mesa Lavapipe Vulkan ICD is unavailable."
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"

      - name: Run cel applicator structural test
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/cel_stylized_pbr_applicator_test.gd

      - name: Compile and render with Vulkan Mobile
        shell: bash
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/prompt-005-vulkan-mobile.png"
          log="$RUNNER_TEMP/prompt-005-vulkan-mobile.log"
          IOM_SHADER_CAPTURE_PATH="$capture" xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$RUNNER_TEMP/godot/godot" \
            --path client-godot \
            --display-driver x11 \
            --rendering-method mobile \
            --rendering-driver vulkan \
            --audio-driver Dummy \
            --script res://tests/cel_stylized_pbr_shader_compile_test.gd 2>&1 | tee "$log"
          if grep -Eiq 'ERROR:|shader compilation failed|failed to compile shader' "$log"; then
            echo "::error::Godot reported an error during the Vulkan Mobile shader render."
            exit 1
          fi
          test -s "$capture"
          (
            cd "$RUNNER_TEMP"
            sha256sum prompt-005-vulkan-mobile.png > prompt-005-vulkan-mobile.sha256
          )
          capture_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/prompt-005-vulkan-mobile.sha256")"
          desktop_shader_sha="$(sha256sum client-godot/shaders/cel_stylized_pbr.gdshader | cut -d' ' -f1)"
          mobile_shader_sha="$(sha256sum client-godot/shaders/cel_stylized_pbr_mobile.gdshader | cut -d' ' -f1)"
          shared_shader_sha="$(sha256sum client-godot/shaders/cel_stylized_pbr_shared.gdshaderinc | cut -d' ' -f1)"
          actual_source_sha="$(git rev-parse HEAD)"
          test "$actual_source_sha" = "$SOURCE_SHA"
          cat > "$RUNNER_TEMP/prompt-005-vulkan-mobile.provenance.json" <<EOF
          {
            "code_sha": "$actual_source_sha",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "godot_version": "4.7.2.stable",
            "renderer": "mobile",
            "driver": "vulkan",
            "capture_file": "prompt-005-vulkan-mobile.png",
            "capture_sha256": "$capture_sha",
            "shader_source_sha256": {
              "desktop": "$desktop_shader_sha",
              "mobile": "$mobile_shader_sha",
              "shared": "$shared_shader_sha"
            },
            "classification": "DIAGNOSTIC_ONLY_NOT_PREMIUM_VISUAL_ACCEPTANCE"
          }
          EOF
          python3 -m json.tool "$RUNNER_TEMP/prompt-005-vulkan-mobile.provenance.json" >/dev/null
          echo "Godot Vulkan Mobile render completed. Internal capture SHA-256: $capture_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic Vulkan Mobile capture and provenance
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: prompt-005-vulkan-mobile-${{ github.event.pull_request.number || github.run_id }}
          path: |
            ${{ runner.temp }}/prompt-005-vulkan-mobile.png
            ${{ runner.temp }}/prompt-005-vulkan-mobile.sha256
            ${{ runner.temp }}/prompt-005-vulkan-mobile.provenance.json
            ${{ runner.temp }}/prompt-005-vulkan-mobile.log
          if-no-files-found: error
          retention-days: 14

      - name: Render coastal cel work-in-progress preview
        shell: bash
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/prompt-005-coastal-cel-preview.png"
          log="$RUNNER_TEMP/prompt-005-coastal-cel-preview.log"
          IOM_SHADER_VISUAL_CAPTURE_PATH="$capture" xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$RUNNER_TEMP/godot/godot" \
            --path client-godot \
            --display-driver x11 \
            --rendering-method mobile \
            --rendering-driver vulkan \
            --audio-driver Dummy \
            --script res://tests/cel_stylized_pbr_visual_preview.gd 2>&1 | tee "$log"
          if grep -Eiq 'ERROR:|shader compilation failed|failed to compile shader' "$log"; then
            echo "::error::Godot reported an error during the coastal cel preview render."
            exit 1
          fi
          test -s "$capture"
          (
            cd "$RUNNER_TEMP"
            sha256sum prompt-005-coastal-cel-preview.png > prompt-005-coastal-cel-preview.sha256
          )
          capture_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/prompt-005-coastal-cel-preview.sha256")"
          actual_source_sha="$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/prompt-005-coastal-cel-preview.provenance.json" <<EOF
          {
            "code_sha": "$actual_source_sha",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "godot_version": "4.7.2.stable",
            "renderer": "mobile",
            "driver": "vulkan",
            "scene": "res://scenes/realistic_coastal_fx_slice.tscn",
            "capture_file": "prompt-005-coastal-cel-preview.png",
            "capture_sha256": "$capture_sha",
            "classification": "WORK_IN_PROGRESS_NOT_PREMIUM_VISUAL_ACCEPTANCE",
            "quality_floor": "NOT_YET_ACCEPTED",
            "s23_30fps": "NOT_VERIFIED"
          }
          EOF
          python3 -m json.tool "$RUNNER_TEMP/prompt-005-coastal-cel-preview.provenance.json" >/dev/null
          echo "Coastal cel WIP preview SHA-256: $capture_sha (not a quality-floor pass; S23 30fps NOT VERIFIED)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coastal cel work-in-progress preview
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: prompt-005-coastal-cel-preview-${{ github.event.pull_request.number || github.run_id }}
          path: |
            ${{ runner.temp }}/prompt-005-coastal-cel-preview.png
            ${{ runner.temp }}/prompt-005-coastal-cel-preview.sha256
            ${{ runner.temp }}/prompt-005-coastal-cel-preview.provenance.json
            ${{ runner.temp }}/prompt-005-coastal-cel-preview.log
          if-no-files-found: error
          retention-days: 14
