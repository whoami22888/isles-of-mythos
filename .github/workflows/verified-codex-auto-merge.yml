name: Verified Codex PR Auto Merge
on:
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI, "Codacy Security Scan", "CodeQL Advanced", "Static Security Quality", "Performance Acceptance", "IOM-00 Godot client", "Godot visual evidence", "Godot external art provenance", "Stage Poly Haven coastal PBR candidate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Reconcile a specific PR"
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: gated-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Evaluate final-SHA gates and merge if eligible
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
        run: node scripts/auto-merge-gate.mjs
