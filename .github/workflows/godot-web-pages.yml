name: IOM browser export and Pages

on:
  pull_request:
    paths:
      - "client-godot/**"
      - ".github/workflows/godot-web-pages.yml"
  push:
    branches: [main]
    paths:
      - "client-godot/**"
      - ".github/workflows/godot-web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iom-web-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch hash-pinned Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot/bin" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          install "$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          "$RUNNER_TEMP/godot/godot" --version | grep -F "4.7.2.stable"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "$TEMPLATES_SHA256  $RUNNER_TEMP/godot/templates.tpz" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -R "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Create isolated browser Compatibility export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-project" "$RUNNER_TEMP/web-site"
          cp -a client-godot/. "$RUNNER_TEMP/web-project/"
          python3 - "$RUNNER_TEMP/web-project/project.godot" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          content = path.read_text()
          assert 'renderer/rendering_method="mobile"' in content, "Locked mobile baseline changed"
          content = content.replace('renderer/rendering_method="mobile"', 'renderer/rendering_method="gl_compatibility"')
          content = content.replace('renderer/rendering_method.mobile="mobile"', 'renderer/rendering_method.mobile="gl_compatibility"')
          path.write_text(content)
          PY
          cat >> "$RUNNER_TEMP/web-project/export_presets.cfg" <<'PRESET'

          [preset.1]

          name="Web Browser"
          platform="Web"
          runnable=false
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()

          [preset.1.options]

          variant/extensions_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progress_bar/enable=true
          PRESET
          "$RUNNER_TEMP/godot/godot" --headless --editor --path "$RUNNER_TEMP/web-project" --quit --import
          "$RUNNER_TEMP/godot/godot" --headless --path "$RUNNER_TEMP/web-project" --export-release "Web Browser" "$RUNNER_TEMP/web-site/index.html"
          test -s "$RUNNER_TEMP/web-site/index.html"
          test -n "$(find "$RUNNER_TEMP/web-site" -maxdepth 1 -name '*.wasm' -size +0c -print -quit)"
          test -n "$(find "$RUNNER_TEMP/web-site" -maxdepth 1 -name '*.pck' -size +0c -print -quit)"
          touch "$RUNNER_TEMP/web-site/.nojekyll"
          (cd "$RUNNER_TEMP/web-site" && sha256sum index.html *.wasm *.pck > SHA256SUMS)
      - name: Validate a game is available, not merely the legacy token-entry shell
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'Enter a login token to connect' client-godot/scripts/boot.gd; then
            echo "::error::Web export is only a token-entry shell; cannot advertise a verified playable game. Integrate player authentication and actual gameplay before publishing."
            exit 1
          fi
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: iom-web-export
          path: ${{ runner.temp }}/web-site
          if-no-files-found: error
      - name: Upload GitHub Pages payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/web-site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web-export
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
