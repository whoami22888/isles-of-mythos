name: IOM-00 Godot client

on:
  pull_request:
    paths:
      - "client-godot/**"
      - ".github/workflows/godot-iom-00.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iom-00-godot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

jobs:
  import-and-android-debug:
    name: Godot 4.7.2 import and Android ARM64 debug export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          install "$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          "$RUNNER_TEMP/godot/godot" --version | grep -F "4.7.2.stable"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "$TEMPLATES_SHA256  $RUNNER_TEMP/godot/templates.tpz" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -R "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Headless import and smoke test
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/godot" --headless --editor --path client-godot --quit --import
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/headless_smoke.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/island_preview_smoke.gd
      - name: Verify Android export prerequisites
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/platform-tools/adb" ]; then
            echo "::error::Android SDK/platform-tools are unavailable; ARM64 APK export is blocked and no APK will be claimed."
            exit 1
          fi
          command -v java >/dev/null
          command -v gradle >/dev/null || [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]
      - name: Export signed Android ARM64 debug APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iom-artifacts"
          # Explicit per-run debug identity, verified against the final APK.
          debug_keystore="$RUNNER_TEMP/iom-debug.keystore"
          keytool -genkeypair -noprompt -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -storetype PKCS12 -keystore "$debug_keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          chmod 600 "$debug_keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$debug_keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --export-debug "Android Debug" "$RUNNER_TEMP/iom-artifacts/isles-of-mythos-debug.apk"
          (cd "$RUNNER_TEMP/iom-artifacts" && sha256sum isles-of-mythos-debug.apk > SHA256SUMS)
      - name: Validate ARM64 APK structure and provenance
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/iom-artifacts/isles-of-mythos-debug.apk"
          test -s "$apk"
          unzip -t "$apk" > /dev/null
          entries_file="$RUNNER_TEMP/iom-artifacts/APK_ENTRIES.txt"
          unzip -Z1 "$apk" > "$entries_file"
          validate_arm64_entries() {
            local listing="$1"
            grep -Fxq 'AndroidManifest.xml' "$listing" || return 1
            grep -Eq '^lib/arm64-v8a/[^/]+\.so$' "$listing" || return 1
            if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' "$listing"; then
              return 1
            fi
          }
          validate_arm64_entries "$entries_file" || {
            echo "::error::APK manifest or ARM64-only library contract failed"
            exit 1
          }
          # Regression: large valid listings must pass; any foreign ABI must fail.
          listing_test="$(mktemp)"
          {
            printf 'AndroidManifest.xml\nlib/arm64-v8a/libgodot_android.so\n'
            printf 'assets/file-%s.bin\n' {1..5000}
          } > "$listing_test"
          validate_arm64_entries "$listing_test" || {
            echo "::error::Large valid APK listing was rejected"
            exit 1
          }
          printf 'lib/x86/libforeign.so\n' >> "$listing_test"
          if validate_arm64_entries "$listing_test"; then
            echo "::error::Mixed-ABI listing was incorrectly accepted"
            exit 1
          fi
          rm -f "$listing_test"
          {
            echo "source_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "godot_version=$("$RUNNER_TEMP/godot/godot" --version)"
            echo "target_abi=arm64-v8a"
            echo "export_preset=Android Debug"
          } > "$RUNNER_TEMP/iom-artifacts/BUILD_PROVENANCE.txt"
          (cd "$RUNNER_TEMP/iom-artifacts" && sha256sum --check SHA256SUMS)
      - name: Verify Android package identity and debug signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/iom-artifacts/isles-of-mythos-debug.apk"
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-}}"
          test -d "$ANDROID_HOME/build-tools"
          mapfile -t sdk_versions < <(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V)
          test "${#sdk_versions[@]}" -gt 0
          sdk_tools="${sdk_versions[${#sdk_versions[@]}-1]}"
          test -x "$sdk_tools/apksigner"
          test -x "$sdk_tools/aapt2"
          expected_signer="$(keytool -list -v -keystore "$RUNNER_TEMP/iom-debug.keystore" -storepass android -alias androiddebugkey | sed -nE 's/^[[:space:]]*SHA256: ([[:xdigit:]:]+).*/\1/p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "${#expected_signer}" -eq 64
          verify_expected_signer() {
            local target="$1" receipt="$2" digest
            "$sdk_tools/apksigner" verify --verbose --print-certs "$target" > "$receipt" || return 1
            digest="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: ([[:xdigit:]]+).*/\1/p' "$receipt" | tr '[:upper:]' '[:lower:]')"
            test "${#digest}" -eq 64 || return 1
            if grep -Eq '^Signer #([2-9]|[1-9][0-9]+) certificate SHA-256 digest:' "$receipt"; then
              return 1
            fi
            test "$digest" = "$expected_signer"
          }
          verify_expected_signer "$apk" "$RUNNER_TEMP/iom-artifacts/APK_SIGNATURE.txt" || {
            echo "::error::APK signer does not match the debug key supplied to Godot"
            exit 1
          }
          # Negative regression: valid APK signed with an unrelated key is rejected.
          alternate_keystore="$RUNNER_TEMP/iom-alternate-debug.keystore"
          keytool -genkeypair -noprompt -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -storetype PKCS12 -keystore "$alternate_keystore" -storepass android -keypass android -dname "CN=Unrelated Debug,O=Android,C=US" > /dev/null
          alternate_apk="$RUNNER_TEMP/iom-alternate-debug.apk"
          "$sdk_tools/apksigner" sign --ks "$alternate_keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out "$alternate_apk" "$apk"
          if verify_expected_signer "$alternate_apk" "$RUNNER_TEMP/iom-alternate-signature.txt"; then
            echo "::error::An unrelated APK signer was incorrectly accepted"
            exit 1
          fi
          rm -f "$alternate_apk" "$alternate_keystore" "$RUNNER_TEMP/iom-alternate-signature.txt"
          "$sdk_tools/aapt2" dump packagename "$apk" > "$RUNNER_TEMP/iom-artifacts/APK_PACKAGE.txt"
          grep -Fxq "com.whoami22888.islesofmythos" "$RUNNER_TEMP/iom-artifacts/APK_PACKAGE.txt"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: iom-00-android-debug
          path: ${{ runner.temp }}/iom-artifacts
          if-no-files-found: error
