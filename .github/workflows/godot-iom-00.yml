name: IOM-00 Godot client

on:
  # Every pull request builds and uploads a debug APK (IOM-00), not only client-godot changes.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iom-00-godot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

jobs:
  import-and-android-debug:
    name: Godot 4.7.2 import and Android ARM64 debug export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          install "$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          "$RUNNER_TEMP/godot/godot" --version | grep -F "4.7.2.stable"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "$TEMPLATES_SHA256  $RUNNER_TEMP/godot/templates.tpz" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -R "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Run Prompt 005 triplanar normal reference regressions
        run: python3 -m unittest discover -s client-godot/tests -p "test_triplanar_normal_math.py"
      - name: Headless import and smoke test
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/godot" --headless --editor --path client-godot --quit --import
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/headless_smoke.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/websocket_adapter_hardening_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/websocket_close_after_auth_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/authoritative_command_gateway_smoke.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/island_preview_smoke.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/vertical_slice_smoke.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/vertical_slice_protocol_regression.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/vertical_slice_world_regression.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/vertical_slice_review_regression.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/guild_objectives_panel_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/expeditions_panel_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/daily_objectives_panel_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/vertical_slice_ground_coverage_regression.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/vertical_slice_coastal_world_regression.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/phone_handoff_regression.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/creature_snapshot_assembler_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/craft_panel_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/touch_controls_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/mobile_hud_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/vertical_slice_player_avatar_test.gd
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --script res://tests/mobile_lod_test.gd
      - name: Install software Vulkan and X11 test dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Regression-check the rewrite against the regional EC2 mirror used by ubuntu-24.04.
          sample_uri='URIs: http://us-east-2.ec2.archive.ubuntu.com/ubuntu'
          expected_uri='URIs: https://archive.ubuntu.com/ubuntu'
          rewritten_uri="$(printf '%s\n' "$sample_uri" | sed -E 's|http://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g')"
          if [ "$rewritten_uri" != "$expected_uri" ]; then
            echo "::error::Ubuntu regional mirror rewrite regression: $rewritten_uri"
            exit 1
          fi

          source_file=/etc/apt/sources.list.d/ubuntu.sources
          if [ ! -f "$source_file" ]; then
            echo "::error::Ubuntu 24.04 deb822 source file is missing."
            exit 1
          fi
          sudo sed -E -i 's|http://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
          if ! grep -q 'https://archive.ubuntu.com/ubuntu' "$source_file"; then
            echo "::error::Official Ubuntu archive mirror was not configured."
            exit 1
          fi

          # xvfb and xauth are already present on the pinned ubuntu-24.04 runner image.
          command -v xvfb-run >/dev/null
          command -v xauth >/dev/null

          # Keep the existing 180s hard cap; add per-request timeouts/retries to update and install.
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --no-install-recommends -y mesa-vulkan-drivers

          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lvp_icd" ]; then
            echo "::error::Mesa Lavapipe Vulkan ICD is unavailable."
            exit 1
          fi
          echo "mesa_vulkan_drivers_version=$(dpkg-query -W -f='\${Version}' mesa-vulkan-drivers)" >> "$GITHUB_ENV"
          export VK_ICD_FILENAMES="$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
      - name: Compile and render Prompt 005 with Vulkan Mobile
        shell: bash
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/prompt-005-vulkan-mobile.png"
          log="$RUNNER_TEMP/prompt-005-vulkan-mobile.log"
          IOM_SHADER_CAPTURE_PATH="$capture" xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$RUNNER_TEMP/godot/godot" \
            --path client-godot \
            --display-driver x11 \
            --rendering-method mobile \
            --rendering-driver vulkan \
            --audio-driver Dummy \
            --script res://tests/cel_stylized_pbr_shader_compile_test.gd 2>&1 | tee "$log"
          if grep -Eiq 'ERROR:|shader compilation failed|failed to compile shader' "$log"; then
            echo "::error::Godot reported an error during the Vulkan Mobile shader render."
            exit 1
          fi
          test -s "$capture"
          sha256sum "$capture" | tee "$RUNNER_TEMP/prompt-005-vulkan-mobile.sha256"
          printf 'renderer=vulkan\\nmethod=mobile\\n' | tee "$RUNNER_TEMP/prompt-005-vulkan-mobile-receipt.txt"
          cat "$RUNNER_TEMP/prompt-005-vulkan-mobile.sha256" >> "$RUNNER_TEMP/prompt-005-vulkan-mobile-receipt.txt"
      - name: Verify Android export prerequisites
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/platform-tools/adb" ]; then
            echo "::error::Android SDK/platform-tools are unavailable; ARM64 APK export is blocked and no APK will be claimed."
            exit 1
          fi
          command -v java >/dev/null
          command -v gradle >/dev/null || [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]
      - name: Export signed Android ARM64 debug APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iom-artifacts"
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --export-debug "Android Debug" "$RUNNER_TEMP/iom-artifacts/isles-of-mythos-debug.apk"
          sha256sum "$RUNNER_TEMP/iom-artifacts/isles-of-mythos-debug.apk" | tee "$RUNNER_TEMP/iom-artifacts/SHA256SUMS"
      - name: Verify the APK carries a valid signature
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-}}"
          apksigner="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner is unavailable; the APK cannot be described as signed."
            exit 1
          fi
          "$apksigner" verify --verbose "$RUNNER_TEMP/iom-artifacts/isles-of-mythos-debug.apk" | tee "$RUNNER_TEMP/iom-artifacts/APKSIGNER.txt"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: iom-00-android-debug
          path: ${{ runner.temp }}/iom-artifacts
          if-no-files-found: error
          retention-days: 14
