name: IOM Coastal Ship FX Integration

on:
  pull_request:
    paths:
      - "client-godot/scenes/realistic_coastal_fx_slice.tscn"
      - "client-godot/scripts/coastal_ship_fx_controller.gd"
      - "client-godot/scripts/ship_wake_effect.gd"
      - "client-godot/shaders/ship_wake_foam.gdshader"
      - "client-godot/scripts/ship_bow_spray_effect.gd"
      - "client-godot/shaders/ship_bow_spray.gdshader"
      - "client-godot/scripts/realistic_coastal_slice.gd"
      - "client-godot/tests/coastal_ship_fx_integration_test.gd"
      - "client-godot/tests/render_coastal_fx_sequence.gd"
      - "client-godot/tests/coastal_ocean_integration_test.gd"
      - "client-godot/tests/coastal_shore_heightfield_test.gd"
      - "client-godot/scripts/coastal_shore_heightfield.gd"
      - "client-godot/shaders/coastal_shore_sampler.gdshaderinc"
      - "client-godot/shaders/ocean_surface.gdshader"
      - "client-godot/shaders/far_ocean_mobile.gdshader"
      - ".github/workflows/iom-coastal-ship-fx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact head checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install checksum-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
      - name: Import assets exactly once before runtime test
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s "$RUNNER_TEMP/godot" --headless --path client-godot --editor --quit --import
      - name: Run real scene-integrated camera/motion/VFX regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coastal_ship_fx_integration_test.gd
      - name: Verify actual mesh-heightmap binding and full sail/mast framing
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coastal_shore_heightfield_test.gd
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coastal_ocean_integration_test.gd
      - name: Preserve old scene contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/realistic_coastal_slice_test.gd
      - name: Capture real moving ship/wake/spray footage (internal QA only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg
          mkdir -p "$RUNNER_TEMP/coastal-fx-frames" "$RUNNER_TEMP/coastal-fx-evidence"
          IOM_FX_FRAMES_DIR="$RUNNER_TEMP/coastal-fx-frames" timeout --signal=TERM --kill-after=10s 240s xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --path client-godot --rendering-method gl_compatibility --script res://tests/render_coastal_fx_sequence.gd
          test "$(find "$RUNNER_TEMP/coastal-fx-frames" -name 'frame_*.png' | wc -l)" -eq 72
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 24 -i "$RUNNER_TEMP/coastal-fx-frames/frame_%04d.png" -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart "$RUNNER_TEMP/coastal-fx-evidence/ship-wake-cinematic.mp4"
          cp "$RUNNER_TEMP/coastal-fx-frames/frame_0000.png" "$RUNNER_TEMP/coastal-fx-evidence/cinematic-start.png"
          cp "$RUNNER_TEMP/coastal-fx-frames/frame_0035.png" "$RUNNER_TEMP/coastal-fx-evidence/cinematic-middle.png"
          cp "$RUNNER_TEMP/coastal-fx-frames/frame_0071.png" "$RUNNER_TEMP/coastal-fx-evidence/cinematic-end.png"
          printf 'commit=%s\\nengine=Godot 4.7.2\\nrender=gl_compatibility under xvfb (NOT physical Android Mobile)\\nsource=72 consecutive real engine frames at 1280x720\\npose_sampling=authored cinematic camera and ship manually advanced at fixed 1/24s simulation intervals for slow llvmpipe runner\\nshader_TIME=Godot runtime TIME during software capture, NOT physical phone time\\nvideo_fps=24\\nvisual_parity=NOT VERIFIED\\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$RUNNER_TEMP/coastal-fx-evidence/EVIDENCE.txt"
          (cd "$RUNNER_TEMP/coastal-fx-evidence" && sha256sum *.png *.mp4 > SHA256SUMS)
          test -s "$RUNNER_TEMP/coastal-fx-evidence/ship-wake-cinematic.mp4"
      - name: Preserve internal partial real frames on renderer failure
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: internal-failed-coastal-capture-frames
          path: ${{ runner.temp }}/coastal-fx-frames/frame_*.png
          retention-days: 3
          if-no-files-found: warn
      - name: Save review-only engine evidence, not publishable visual acceptance
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: internal-coastal-ship-fx-engine-evidence
          path: ${{ runner.temp }}/coastal-fx-evidence/
          retention-days: 7
          if-no-files-found: error
