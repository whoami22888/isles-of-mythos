name: IOM Coastal Ship FX Integration

on:
  pull_request:
    paths:
      - "client-godot/scenes/realistic_coastal_fx_slice.tscn"
      - "client-godot/scenes/realistic_coastal_slice.tscn"
      - "client-godot/scripts/coastal_ship_fx_controller.gd"
      - "client-godot/scripts/ship_wake_effect.gd"
      - "client-godot/shaders/ship_wake_foam.gdshader"
      - "client-godot/scripts/ship_bow_spray_effect.gd"
      - "client-godot/shaders/ship_bow_spray.gdshader"
      - "client-godot/scripts/realistic_coastal_slice.gd"
      - "client-godot/tests/coastal_ship_fx_integration_test.gd"
      - "client-godot/tests/render_coastal_fx_sequence.gd"
      - "client-godot/tests/coastal_ocean_integration_test.gd"
      - "client-godot/tests/coastal_shore_heightfield_test.gd"
      - "client-godot/scripts/coastal_shore_heightfield.gd"
      - "client-godot/shaders/coastal_shore_sampler.gdshaderinc"
      - "client-godot/shaders/ocean_surface.gdshader"
      - "client-godot/assets/external/**"
      - ".github/workflows/iom-coastal-ship-fx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact head checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install checksum-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
      - name: Import assets exactly once before runtime test
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s "$RUNNER_TEMP/godot" --headless --path client-godot --editor --quit --import
      - name: Run real scene-integrated camera/motion/VFX regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coastal_ship_fx_integration_test.gd
      - name: Verify actual mesh-heightmap binding and full sail/mast framing
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coastal_shore_heightfield_test.gd
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coastal_ocean_integration_test.gd
      - name: Verify cinematic camera stays sealed above the sea and matches capture
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coastal_cinematic_path_test.gd
      - name: Preserve old scene contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/realistic_coastal_slice_test.gd
  capture:
    needs: integrate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        segment: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Godot and renderer tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
          timeout --signal=TERM --kill-after=10s 180s "$RUNNER_TEMP/godot" --headless --path client-godot --editor --quit --import
      - name: Render exact frame partition
        shell: bash
        env:
          SEGMENT: ${{ matrix.segment }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coastal-fx-frames"
          export IOM_FX_FRAMES_DIR="$RUNNER_TEMP/coastal-fx-frames"
          export IOM_FX_START_FRAME="$((SEGMENT * 24))"
          export IOM_FX_END_FRAME="$((IOM_FX_START_FRAME + 24))"
          timeout --signal=TERM --kill-after=10s 240s xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --path client-godot --rendering-method mobile --script res://tests/render_coastal_fx_sequence.gd
          test "$(find "$IOM_FX_FRAMES_DIR" -name 'frame_*.rgba' | wc -l)" -eq 24
          (cd "$IOM_FX_FRAMES_DIR" && sha256sum frame_*.rgba > SHA256SUMS)
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: internal-coastal-frames-${{ matrix.segment }}
          path: ${{ runner.temp }}/coastal-fx-frames/
          retention-days: 7
          compression-level: 1
  assemble:
    needs: capture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: internal-coastal-frames-*
          path: frames
          merge-multiple: false
      - name: Verify original worker manifests and assemble in exact frame order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ordered-frames evidence
          for segment in 0 1 2 3; do
            source_dir="frames/internal-coastal-frames-$segment"
            test -d "$source_dir"
            test -f "$source_dir/SHA256SUMS"
            (cd "$source_dir" && sha256sum --check --strict SHA256SUMS)
            test "$(find "$source_dir" -maxdepth 1 -name 'frame_*.rgba' | wc -l)" -eq 24
            for offset in $(seq 0 23); do
              frame_number=$((segment * 24 + offset))
              printf -v filename 'frame_%04d.rgba' "$frame_number"
              test -f "$source_dir/$filename"
              test "$(stat -c %s "$source_dir/$filename")" -eq 3686400
              cp -- "$source_dir/$filename" "ordered-frames/$filename"
            done
          done
          test "$(find ordered-frames -maxdepth 1 -name 'frame_*.rgba' | wc -l)" -eq 96
          python3 -m unittest discover -s scripts/tests -p "test_capture_continuity.py" -v
          python3 -m unittest scripts.tests.test_ship_occupancy -v
          python3 scripts/check_capture_continuity.py ordered-frames --frames 96 --width 1280 --height 720 --segment-size 24 > evidence/CONTINUITY.json
          python3 scripts/check_ship_occupancy.py frames > evidence/SHIP_OCCUPANCY.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p evidence
          ffmpeg -hide_banner -loglevel error -nostdin -y -f image2 -start_number 0 -framerate 24 -c:v rawvideo -pixel_format rgba -video_size 1280x720 -i ordered-frames/frame_%04d.rgba -frames:v 96 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart evidence/ship-wake-cinematic.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=noprint_wrappers=1:nokey=1 evidence/ship-wake-cinematic.mp4)" -eq 96
          # Keep the full reveal and the locked three-second Shot A sequence.
          ffmpeg -hide_banner -loglevel error -nostdin -y -f image2 -start_number 0 -framerate 24 -c:v rawvideo -pixel_format rgba -video_size 1280x720 -i ordered-frames/frame_%04d.rgba -frames:v 72 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart evidence/shot-a-72f.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=noprint_wrappers=1:nokey=1 evidence/shot-a-72f.mp4)" -eq 72
          (cd ordered-frames && sha256sum frame_*.rgba > ../evidence/FRAME_SHA256SUMS)
          (cd evidence && sha256sum ship-wake-cinematic.mp4 shot-a-72f.mp4 > SHA256SUMS)
          printf 'commit=%s\nengine=Godot 4.7.2\nrender=Mobile Vulkan llvmpipe software\nframes=96\nshot_a_frames=72\nresolution=1280x720\nfps=24\nvisual_parity=NOT VERIFIED\n' "${{ github.event.pull_request.head.sha || github.sha }}" > evidence/EVIDENCE.txt
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: internal-coastal-ship-fx-engine-evidence
          path: evidence/
          retention-days: 7
