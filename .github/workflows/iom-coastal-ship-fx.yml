name: IOM Coastal Ship FX Integration

on:
  pull_request:
    paths:
      - "client-godot/scenes/realistic_coastal_fx_slice.tscn"
      - "client-godot/scripts/coastal_ship_fx_controller.gd"
      - "client-godot/scripts/ship_wake_effect.gd"
      - "client-godot/shaders/ship_wake_foam.gdshader"
      - "client-godot/scripts/ship_bow_spray_effect.gd"
      - "client-godot/shaders/ship_bow_spray.gdshader"
      - "client-godot/scripts/realistic_coastal_slice.gd"
      - "client-godot/tests/coastal_ship_fx_integration_test.gd"
      - ".github/workflows/iom-coastal-ship-fx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact head checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install checksum-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
      - name: Import assets exactly once before runtime test
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s "$RUNNER_TEMP/godot" --headless --path client-godot --editor --quit --import
      - name: Run real scene-integrated camera/motion/VFX regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coastal_ship_fx_integration_test.gd
      - name: Preserve old scene contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/realistic_coastal_slice_test.gd
