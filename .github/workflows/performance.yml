name: Performance Acceptance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sustained-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isles_test
      JWT_SECRET: performance-test-secret-012345678901234567890123
      CORS_ORIGIN: http://127.0.0.1:5173
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 3000
      LOADTEST_BASE_URL: http://127.0.0.1:3000
      LOADTEST_DURATION_MS: 10000
      LOADTEST_HTTP_REQUESTS: 100
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild reviewed native dependencies
        run: npm rebuild argon2 esbuild
      - name: Migrate database
        run: npm run migrate:up
      - name: Seed 1,000 player identities
        run: PGPASSWORD=postgres psql "$DATABASE_URL" -c "INSERT INTO users (username, email, password_hash) SELECT 'loadtest_' || g, 'loadtest_' || g || '@example.invalid', 'loadtest-password-hash' FROM generate_series(0, 999) AS g ON CONFLICT DO NOTHING;"
      - name: Build
        run: npm run build
      - name: Start server
        run: |
          node server/dist/index.js > performance-server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat performance-server.log
          exit 1
      - name: Capture host and PostgreSQL metrics during load
        run: |
          (
            while kill -0 "$(cat server.pid)" 2>/dev/null; do
              printf '%s\n' "--- $(date -Is) ---"
              ps -p "$(cat server.pid)" -o pid=,pcpu=,pmem=,rss=,etime=
              PGPASSWORD=postgres psql "$DATABASE_URL" -Atc "SELECT now(), numbackends, xact_commit, xact_rollback, blks_read, blks_hit FROM pg_stat_database WHERE datname='isles_test';"
              sleep 1
            done
          ) > performance-system.log 2>&1 &
      - name: Run sustained player-load scenarios
        run: node scripts/sustained-load.mjs
      - name: Validate complete acceptance report
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync("performance-results.json", "utf8"));
          const expectedPlayers = [10, 50, 100, 500, 1000];
          if (report.event !== "sustained_load_complete" || !Array.isArray(report.scenarios) || report.scenarios.length !== expectedPlayers.length) {
            throw new Error("Performance acceptance report is missing or incomplete");
          }
          for (let index = 0; index < expectedPlayers.length; index += 1) {
            const expected = expectedPlayers[index];
            const scenario = report.scenarios[index];
            if (scenario.players !== expected || scenario.http?.requests !== 100 || scenario.http?.errors !== 0) {
              throw new Error("Invalid HTTP/player-load result for " + expected + " players");
            }
            const websocket = scenario.websocket;
            if (websocket?.requestedPlayers !== expected || websocket.connected !== expected || websocket.authenticated !== expected || websocket.errors !== 0 || websocket.pings <= 0 || websocket.pongs !== websocket.pings || websocket.pingSuccessRate !== 1) {
              throw new Error("Invalid WebSocket acceptance result for " + expected + " players");
            }
            for (const [name, value] of [["HTTP p95", scenario.http.p95Ms], ["WebSocket p95", websocket.p95Ms]]) {
              if (!Number.isFinite(value) || value < 0) throw new Error("Missing or invalid " + name + " metric for " + expected + " players");
            }
          }
          console.log("Complete performance acceptance report verified for 10, 50, 100, 500, and 1000 players.");
          NODE
      - name: Stop server
        if: always()
        run: |
          kill "$(cat server.pid)" 2>/dev/null || true
          wait "$(cat server.pid)" 2>/dev/null || true
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-acceptance-evidence
          path: |
            performance-results.json
            performance-system.log
            performance-server.log
          if-no-files-found: error
