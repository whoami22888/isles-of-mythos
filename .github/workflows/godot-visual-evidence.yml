name: Godot visual evidence

on:
  pull_request:
    paths:
      - "client-godot/**"
      - ".github/workflows/godot-visual-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify coastal download origin regression tests
        run: python3 scripts/test_stage_polyhaven_coast.py
      - name: Verify hash-pinned tropical model closure
        run: python3 scripts/test_stage_polyhaven_models.py
      - name: Quality-slide preflight (before renderer or capture)
        run: |
          set -euo pipefail
          python3 scripts/graphics_quality_preflight.py \
            --client client-godot \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
      - name: Render original prototype reference image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visual-evidence"
          xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --editor --path client-godot --quit --import
          IOM_SCREENSHOT_PATH="$RUNNER_TEMP/visual-evidence/island-preview.png" IOM_CINEMATIC_SCREENSHOT_PATH="$RUNNER_TEMP/visual-evidence/coastal-cinematic.png" xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --path client-godot --rendering-method mobile --script res://tests/render_capture.gd
          file "$RUNNER_TEMP/visual-evidence/island-preview.png"
          test -s "$RUNNER_TEMP/visual-evidence/island-preview.png"
          file "$RUNNER_TEMP/visual-evidence/coastal-cinematic.png"
          test -s "$RUNNER_TEMP/visual-evidence/coastal-cinematic.png"
      - name: Verify both deterministic sculpted terrain regressions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/sculpted_terrain_test.gd
          "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/test_sculpted_island_terrain.gd
      - name: Capture sculpted terrain and reject original-prototype duplicate
        shell: bash
        run: |
          set -euo pipefail
          IOM_SCULPTED_SCREENSHOT_PATH="$RUNNER_TEMP/visual-evidence/sculpted-terrain-preview.png" xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --path client-godot --rendering-method mobile --script res://tests/render_sculpted_terrain.gd
          test -s "$RUNNER_TEMP/visual-evidence/sculpted-terrain-preview.png"
          file "$RUNNER_TEMP/visual-evidence/sculpted-terrain-preview.png"
          if cmp -s "$RUNNER_TEMP/visual-evidence/island-preview.png" "$RUNNER_TEMP/visual-evidence/sculpted-terrain-preview.png"; then
            echo "::error::Sculpted screenshot is byte-identical to original prototype"
            exit 1
          fi
          (cd "$RUNNER_TEMP/visual-evidence" && sha256sum *.png > SHA256SUMS)
      - name: Capture actual boot UI and verify mobile viewport layout/focus
        shell: bash
        run: |
          set -euo pipefail
          IOM_BOOT_UI_OUTPUT_DIR="$RUNNER_TEMP/visual-evidence" xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --path client-godot --rendering-method mobile --script res://tests/render_boot_ui.gd
          for name in boot-1280x720.png boot-960x540.png boot-800x480.png boot-focused-1280x720.png; do
            test -s "$RUNNER_TEMP/visual-evidence/$name"
            file "$RUNNER_TEMP/visual-evidence/$name"
          done
          (cd "$RUNNER_TEMP/visual-evidence" && sha256sum *.png > SHA256SUMS && sha256sum boot-*.png > BOOT-UI-SHA256SUMS)
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: godot-boot-ui-visual-evidence
          path: |
            ${{ runner.temp }}/visual-evidence/boot-1280x720.png
            ${{ runner.temp }}/visual-evidence/boot-960x540.png
            ${{ runner.temp }}/visual-evidence/boot-800x480.png
            ${{ runner.temp }}/visual-evidence/boot-focused-1280x720.png
            ${{ runner.temp }}/visual-evidence/BOOT-UI-SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: godot-rendered-sculpted-terrain
          path: |
            ${{ runner.temp }}/visual-evidence/sculpted-terrain-preview.png
            ${{ runner.temp }}/visual-evidence/island-preview.png
            ${{ runner.temp }}/visual-evidence/coastal-cinematic.png
            ${{ runner.temp }}/visual-evidence/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: godot-rendered-island-reference
          path: ${{ runner.temp }}/visual-evidence/island-preview.png
          if-no-files-found: error
