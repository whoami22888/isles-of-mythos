name: Authenticated Codex repair dispatch

on:
  workflow_dispatch:
    inputs:
      repair:
        description: "Run the approved repair worker"
        required: true
        type: boolean
        default: false
      pr_number:
        description: "Trusted same-repository pull request number"
        required: true
        type: number
      expected_sha:
        description: "Exact pull-request head SHA to repair"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-repair-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  guarded-dispatch:
    if: inputs.repair == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: codex-repair
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate trusted same-repository PR and exact head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid,headRefName,headRepositoryOwner,headRepository --jq '{sha:.headRefOid,branch:.headRefName,owner:.headRepositoryOwner.login,repo:.headRepository.name}' > "$RUNNER_TEMP/pr.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pr.json", "utf8"));
          const [owner, repo] = process.env.REPOSITORY.split("/");
          if (p.repo !== repo || p.owner !== owner) throw new Error("Repair requires a same-repository PR head");
          if (p.sha.toLowerCase() !== process.env.EXPECTED_SHA.toLowerCase()) throw new Error("PR head SHA changed; refusing repair");
          if (p.branch === "main") throw new Error("Protected main branch cannot be a repair target");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${p.sha}\nbranch=${p.branch}\n`);
          NODE

      - name: Refuse credentialed repair until isolated broker is installed
        run: |
          set -euo pipefail
          echo "Credentialed repair is disabled: no separately credentialed host broker and unprivileged container boundary has been installed and adversarially tested."
          exit 1
