name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isles_test
      JWT_SECRET: test-only-jwt-secret-not-for-production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Rebuild reviewed native dependencies
        run: npm rebuild argon2 esbuild
      - name: Verify no unreviewed install scripts
        run: |
          pending="$(npm install-scripts ls)"
          echo "$pending"
          echo "$pending" | grep -F "No packages with unreviewed install scripts."
      - name: Run lint and typecheck in parallel
        shell: bash
        run: |
          set +e
          npm run lint > "$RUNNER_TEMP/lint.log" 2>&1 &
          lint_pid=$!
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1 &
          typecheck_pid=$!

          wait "$lint_pid"
          lint_status=$?
          wait "$typecheck_pid"
          typecheck_status=$?

          cat "$RUNNER_TEMP/lint.log"
          cat "$RUNNER_TEMP/typecheck.log"

          if [ "$lint_status" -ne 0 ] || [ "$typecheck_status" -ne 0 ]; then
            exit 1
          fi
      - run: npm audit --audit-level=high
      - run: npm run migrate:up
      - name: Verify PostgreSQL backup and restore
        run: |
          mkdir -p "$RUNNER_TEMP/isles-backup"
          docker run --rm --network host -e PGPASSWORD=postgres -v "$RUNNER_TEMP/isles-backup:/backup" postgres:17-alpine pg_dump -Fc -h 127.0.0.1 -U postgres -d isles_test -f /backup/isles_test.dump
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE isles_restore"
          docker run --rm --network host -e PGPASSWORD=postgres -v "$RUNNER_TEMP/isles-backup:/backup" postgres:17-alpine pg_restore --no-owner -h 127.0.0.1 -U postgres -d isles_restore /backup/isles_test.dump
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine psql -h 127.0.0.1 -U postgres -d isles_restore -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) > 0 FROM information_schema.tables WHERE table_schema = 'public'"

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/isles
          JWT_SECRET: test-only-jwt-secret-not-for-production
          CORS_ORIGIN: http://localhost:5173
        run: docker compose config -q

      - run: npm run test
      - run: npm run build

      - name: Build production Docker image
        run: docker build --pull --tag isles-of-mythos:ci .
