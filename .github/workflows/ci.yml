name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isles_test
      JWT_SECRET: test-only-jwt-secret-not-for-production
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Rebuild reviewed native dependencies
        run: npm rebuild argon2 esbuild
      - name: Verify no unreviewed install scripts
        run: |
          pending="$(npm install-scripts ls)"
          echo "$pending"
          echo "$pending" | grep -F "No packages with unreviewed install scripts."
      - run: npm audit --audit-level=high
      - run: npm run migrate:up
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
