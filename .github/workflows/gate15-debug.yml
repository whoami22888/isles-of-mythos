name: Gate 15 Typecheck Diagnostic
on:
  push:
    branches: ["phase-15-world-events"]
permissions:
  contents: write
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm rebuild argon2 esbuild
      - name: Capture server typecheck
        run: |
          set +e
          npm run typecheck -w server > server-typecheck.log 2>&1
          status=$?
          cat server-typecheck.log
          cat server-typecheck.log >> "$GITHUB_STEP_SUMMARY"
          mkdir -p diagnostics
          cp server-typecheck.log diagnostics/g15-server-typecheck.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/g15-server-typecheck.log
          git commit -m "chore(g15): persist temporary typecheck diagnostics [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME}
          exit $status
      - name: Upload diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate15-server-typecheck
          path: server-typecheck.log
