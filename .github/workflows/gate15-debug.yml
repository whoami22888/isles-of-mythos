name: Gate 15 Typecheck Diagnostic
on:
  push:
    branches: ["phase-15-world-events"]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm rebuild argon2 esbuild
      - name: Capture server typecheck
        run: |
          set +e
          npm run typecheck -w server > server-typecheck.log 2>&1
          status=$?
          cat server-typecheck.log
          cat server-typecheck.log >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate15-server-typecheck
          path: server-typecheck.log
