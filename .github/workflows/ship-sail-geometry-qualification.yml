name: Ship Sail Geometry Qualification
on:
  pull_request:
    paths:
      - 'scripts/qualify_polyhaven_ship_geometry.py'
      - '.github/workflows/ship-sail-geometry-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Analyse verified publisher meshes without game admission
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ship-qualification"
          python3 scripts/qualify_polyhaven_ship_geometry.py \
            --output "$RUNNER_TEMP/ship-qualification/ship-sail-geometry-report.json"
          python3 -m json.tool "$RUNNER_TEMP/ship-qualification/ship-sail-geometry-report.json" >/dev/null
          (cd "$RUNNER_TEMP/ship-qualification" && sha256sum ship-sail-geometry-report.json > SHA256SUMS)
      - name: Retain quarantine report (not game-ready assets)
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: unadmitted-ship-sail-geometry
          path: |
            ${{ runner.temp }}/ship-qualification/ship-sail-geometry-report.json
            ${{ runner.temp }}/ship-qualification/SHA256SUMS
          retention-days: 7
          if-no-files-found: warn
