name: Godot tropical foliage motion evidence

on:
  pull_request:
    paths:
      - "client-godot/shaders/tropical_foliage_wind.gdshader"
      - "client-godot/scripts/tropical_bay_dressing.gd"
      - "client-godot/tests/tropical_bay_dressing_test.gd"
      - "client-godot/tests/render_tropical_foliage_motion.gd"
      - ".github/workflows/godot-tropical-foliage-motion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foliage-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install hash-pinned Godot and actual render/encoding tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers ffmpeg
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
      - name: Import actual game resources and validate foliage shader binding
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s "$RUNNER_TEMP/godot" --headless --editor --path client-godot --quit --import
          timeout --signal=TERM --kill-after=10s 120s "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/tropical_bay_dressing_test.gd
      - name: Render 48 consecutive foliage frames with fixed simulation clock
        shell: bash
        env:
          IOM_FOLIAGE_FRAMES_DIR: ${{ runner.temp }}/foliage-raw
          IOM_FOLIAGE_EVIDENCE_DIR: ${{ runner.temp }}/foliage-evidence
        run: |
          set -euo pipefail
          mkdir -p "$IOM_FOLIAGE_FRAMES_DIR" "$IOM_FOLIAGE_EVIDENCE_DIR"
          timeout --signal=TERM --kill-after=10s 240s xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --path client-godot --rendering-method mobile --script res://tests/render_tropical_foliage_motion.gd
          test "$(find "$IOM_FOLIAGE_FRAMES_DIR" -maxdepth 1 -name 'frame_*.rgba' | wc -l)" -eq 48
          for frame in "$IOM_FOLIAGE_FRAMES_DIR"/frame_*.rgba; do
            test "$(stat -c %s "$frame")" -eq 3686400
          done
          (cd "$IOM_FOLIAGE_FRAMES_DIR" && sha256sum frame_*.rgba > "$IOM_FOLIAGE_EVIDENCE_DIR/FRAME_SHA256SUMS")
      - name: Encode and verify inspectable real Godot MP4
        shell: bash
        env:
          IOM_FOLIAGE_FRAMES_DIR: ${{ runner.temp }}/foliage-raw
          IOM_FOLIAGE_EVIDENCE_DIR: ${{ runner.temp }}/foliage-evidence
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -nostdin -y -f image2 -start_number 0 -framerate 24 -c:v rawvideo -pixel_format rgba -video_size 1280x720 -i "$IOM_FOLIAGE_FRAMES_DIR/frame_%04d.rgba" -frames:v 48 -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -movflags +faststart "$IOM_FOLIAGE_EVIDENCE_DIR/tropical-foliage-motion.mp4"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=noprint_wrappers=1:nokey=1 "$IOM_FOLIAGE_EVIDENCE_DIR/tropical-foliage-motion.mp4")" -eq 48
          test -s "$IOM_FOLIAGE_EVIDENCE_DIR/foliage-frame-0000.png"
          test -s "$IOM_FOLIAGE_EVIDENCE_DIR/foliage-frame-0024.png"
          test -s "$IOM_FOLIAGE_EVIDENCE_DIR/foliage-frame-0047.png"
          printf 'commit=%s\nengine=Godot 4.7.2\nrenderer=Mobile Vulkan software\nscene=realistic_coastal_slice.tscn\nframe_count=48\nresolution=1280x720\nfps=24\nsource=consecutive actual engine-rendered RGBA frames\nowner_quality=NOT VERIFIED\nAndroid_device=NOT VERIFIED\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$IOM_FOLIAGE_EVIDENCE_DIR/EVIDENCE.txt"
          (cd "$IOM_FOLIAGE_EVIDENCE_DIR" && sha256sum tropical-foliage-motion.mp4 foliage-frame-*.png EVIDENCE.txt FRAME_SHA256SUMS > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Preserve internal first-party foliage evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: godot-internal-tropical-foliage-motion
          path: ${{ runner.temp }}/foliage-evidence/
          retention-days: 14
          if-no-files-found: error
