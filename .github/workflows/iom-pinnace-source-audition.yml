name: Isles premium pinnace source-and-engine audition (internal only)

on:
  pull_request:
    paths:
      - 'scripts/audition_pinnace_source.py'
      - 'scripts/test_pinnace_audition.py'
      - 'asset-sources/ship_pinnace_audition.json'
      - 'client-godot/tests/render_pinnace_audition.gd'
      - '.github/workflows/iom-pinnace-source-audition.yml'
      - 'docs/graphics/PINNACE_SOURCE_AND_RENDER_AUDITION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Isolated dependency for PBR alpha and frame checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/iom-python"
          "$RUNNER_TEMP/iom-python/bin/python" -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          echo "$RUNNER_TEMP/iom-python/bin" >> "$GITHUB_PATH"
      - name: Test quarantined publisher verification, never admit model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audition_pinnace_source.py scripts/test_pinnace_audition.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p test_pinnace_audition.py -v
      - name: Download source publisher's exact glTF and original opacity maps
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audition_pinnace_source.py \
            --manifest asset-sources/ship_pinnace_audition.json \
            --stage client-godot/assets/world_audition/pinnace \
            --receipt "$RUNNER_TEMP/pinnace-original-source-sha256-receipt.json"
      - name: Install pinned Godot 4.7.2 and ffmpeg encoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
      - name: Godot real import of authentic high-detail PBR ship
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            "$RUNNER_TEMP/godot" --editor --path client-godot --quit --import
      - name: Capture actual 240 consecutive engine frames (not approved visuals)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinnace-evidence"
          IOM_AUDITION_FRAMES="$RUNNER_TEMP/pinnace-evidence" \
            xvfb-run -a -s '-screen 0 1280x720x24' \
              "$RUNNER_TEMP/godot" --path client-godot --rendering-method gl_compatibility \
              --script res://tests/render_pinnace_audition.gd
          test -s "$RUNNER_TEMP/pinnace-evidence/candidate_still.png"
          python3 scripts/audition_assets.py --verify-frames "$RUNNER_TEMP/pinnace-evidence" --min-frames 240
      - name: Encode real MP4 and close receipts (fail closed; not premium approval)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pinnace-evidence"
          ffmpeg -hide_banner -loglevel error -nostdin -y -framerate 24 \
            -i frame_%03d.png -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
            -movflags +faststart candidate_engine_motion.mp4
          COUNT="$(ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames -of default=noprint_wrappers=1:nokey=1 candidate_engine_motion.mp4)"
          test "$COUNT" = 240
          cp "$RUNNER_TEMP/pinnace-original-source-sha256-receipt.json" source-receipt.json
          cat > evidence.json <<EOF
          {"commit":"${{ github.event.pull_request.head.sha || github.sha }}",
           "renderer":"Godot 4.7.2 gl_compatibility, headless Xvfb; NOT phone FPS",
           "duration_seconds":10,"fps":24,"frames":240,"source":"Poly Haven Ship Pinnace 1K CC0",
           "original_sail_mesh":true,"synthetic_sail_mesh":false,
           "source_skeletal_animation":"UNAVAILABLE","android_lod":"NOT VERIFIED",
           "source_sha256_pins":"PINNED FROM VERIFIED ORIGINAL BYTES",
           "visual_acceptance":"NOT VERIFIED; hold artifact internal; no merge as premium",
           "owner_master_sha256":"713cd6e90c6f7d589a06eb3bd4b9b2d5ebeb9c0ff711b5de527a68460dfbcb05"}
          EOF
          sha256sum candidate_still.png candidate_072.png candidate_192.png candidate_engine_motion.mp4 source-receipt.json evidence.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          find . -maxdepth 1 -name 'frame_*.png' -delete
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: iom-internal-premium-pinnace-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pinnace-evidence/candidate_still.png
            ${{ runner.temp }}/pinnace-evidence/candidate_072.png
            ${{ runner.temp }}/pinnace-evidence/candidate_192.png
            ${{ runner.temp }}/pinnace-evidence/candidate_engine_motion.mp4
            ${{ runner.temp }}/pinnace-evidence/source-receipt.json
            ${{ runner.temp }}/pinnace-evidence/evidence.json
            ${{ runner.temp }}/pinnace-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
