# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '36 4 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # CLI 7.10.0
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          # Scanner crashes are failures even when a partial SARIF can be generated.
          fail-if-incomplete: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Findings remain visible to GitHub code scanning. This limit does not
          # suppress scanner execution failures (fail-if-incomplete above).
          max-allowed-issues: 2147483647

      # Codacy emits separate runs per tool invocation without analysis IDs.
      # Assign IDs in the upload source; preserve every run and the raw report.
      - name: Identify Codacy SARIF analyses
        id: sarif-identity
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        run: |
          python3 -m unittest discover -s scripts -p test_codacy_sarif_identity.py -v
          python3 scripts/codacy_sarif_identity.py results.sarif upload-results.sarif

      # Preserve complete or partial diagnostic evidence even if a tool crashes.
      - name: Retain SARIF evidence
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: codacy-sarif-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            results.sarif
            upload-results.sarif
          if-no-files-found: error
          retention-days: 30

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        if: ${{ always() && steps.sarif-identity.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        env:
          # upload-sarif derives the code-scanning identity from the runner
          # context; override that context explicitly because this job scans
          # the PR head rather than the default pull_request merge ref.
          GITHUB_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          sarif_file: upload-results.sarif
