# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '36 4 * * 3'

permissions:
  contents: read

jobs:
  analyzer:
    name: Codacy ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        tool:
          - agentlinter
          - bandit
          - biome
          - checkov
          - csslint
          - eslint-9
          - hadolint
          - jacksonlinter
          - jshint
          - lizard
          - markdownlint
          - opengrep
          - oxlint
          - pmd
          - pmd-7
          - prospector
          - pylint
          - pylintpython3
          - remark-lint
          - ruff
          - spectral
          - stylelint
          - tslint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run explicitly selected Codacy analyzer
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # CLI 7.10.0
        with:
          tool: ${{ matrix.tool }}
          fail-if-incomplete: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
      - name: Validate and split complete SARIF
        run: |
          python3 -m unittest discover -s scripts -p test_codacy_sarif_identity.py -v
          python3 scripts/codacy_sarif_identity.py results.sarif upload-results
          test "$(find upload-results -maxdepth 1 -name "part-*.sarif" -type f | wc -l)" -eq 1
      - name: Retain analyzer SARIF
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: codacy-${{ matrix.tool }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: results.sarif
          if-no-files-found: error
      - name: Upload analyzer SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: upload-results/part-01.sarif
          category: codacy-${{ matrix.tool }}
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
  trivy:
    name: Trivy filesystem security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan vulnerabilities, secrets and misconfiguration
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo docker.io/aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs --scanners vuln,secret,misconfig --format sarif --output /repo/trivy.sarif /repo
      - name: Retain Trivy SARIF
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: trivy-${{ github.event.pull_request.head.sha || github.sha }}
          path: trivy.sarif
          if-no-files-found: error
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-filesystem
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
  codacy-security-scan:
    name: Codacy Security Scan
    if: ${{ always() }}
    needs: [analyzer, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Require every scanner and upload
        env:
          ANALYZERS: ${{ needs.analyzer.result }}
          TRIVY: ${{ needs.trivy.result }}
        run: |
          test "$ANALYZERS" = success
          test "$TRIVY" = success
