name: Godot external art provenance

on:
  pull_request:
    paths:
      - "client-godot/assets/**"
      - "scripts/validate_godot_assets.py"
      - "scripts/validate_visual_assets.py"
      - "scripts/test_validate_visual_assets.py"
      - "scripts/test_godot_asset_validator.py"
      - "scripts/test_godot_asset_fetcher.py"
      - "scripts/fetch_verified_godot_assets.py"
      - ".github/workflows/godot-art-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile pinned asset importer
        run: python3 -m py_compile scripts/fetch_verified_godot_assets.py
      - name: Run visual material rejection regressions
        run: python3 scripts/test_validate_visual_assets.py
      - name: Validate every submitted GLTF material directly
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find client-godot/assets -type f -name '*.gltf' -print)
          if [ "${#assets[@]}" -gt 0 ]; then
            python3 scripts/validate_visual_assets.py "${assets[@]}"
          else
            echo "No GLTF assets submitted; synthetic rejection tests still ran."
          fi
      - name: Run provenance rejection regression tests
        run: python3 scripts/test_godot_asset_validator.py
      - name: Run offline importer regression tests
        run: python3 scripts/test_godot_asset_fetcher.py
      - name: Validate provenance manifest, hashes and permitted licenses
        run: python3 scripts/validate_godot_assets.py
