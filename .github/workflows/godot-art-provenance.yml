name: Godot external art provenance

on:
  pull_request:
    paths:
      - "client-godot/assets/**"
      - "scripts/validate-godot-assets.py"
      - "scripts/fetch-verified-godot-assets.py"
      - ".github/workflows/godot-art-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compile pinned asset importer
        run: python3 -m py_compile scripts/fetch-verified-godot-assets.py
      - name: Validate provenance manifest, hashes and permitted licenses
        run: python3 scripts/validate-godot-assets.py
