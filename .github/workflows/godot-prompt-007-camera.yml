name: Prompt 007 Godot Mobile Vulkan camera-motion evidence

on:
  pull_request:
    paths:
      - ".github/workflows/godot-prompt-007-camera.yml"
      - "client-godot/gameplay/touch_controls.gd"
      - "client-godot/gameplay/vertical_slice.tscn"
      - "client-godot/gameplay/vertical_slice_world.gd"
      - "client-godot/scripts/camera_terrain_collision_factory.gd"
      - "client-godot/scripts/camera_zoom_controller.gd"
      - "client-godot/scripts/rendering_evidence_guard.gd"
      - "client-godot/tests/camera_zoom_controller_regression.gd"
      - "client-godot/tests/render_vertical_slice_gameplay.gd"
      - "client-godot/tests/vertical_slice_review_regression.gd"

permissions:
  contents: read

concurrency:
  group: prompt-007-camera-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  capture:
    name: Godot 4.7.2 Mobile/Vulkan camera-motion evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install hash-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          install "$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          "$RUNNER_TEMP/godot/godot" --version | grep -F "4.7.2.stable"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/godot" --headless --editor --path client-godot --quit --import

      - name: Install and select software Vulkan ICD
        shell: bash
        run: |
          set -euo pipefail
          mirror_file=/etc/apt/apt-mirrors.txt
          if [ ! -s "$mirror_file" ]; then
            echo "::error::Expected Ubuntu runner apt mirror list is missing."
            exit 1
          fi

          for sample_uri in 'http://us-east-2.ec2.archive.ubuntu.com/ubuntu' 'http://us-east-2.ec2.archive.ubuntu.com/ubuntu/' 'https://us-east-2.ec2.archive.ubuntu.com/ubuntu' 'https://us-east-2.ec2.archive.ubuntu.com/ubuntu/'; do
            expected_uri='https://archive.ubuntu.com/ubuntu'
            rewritten_uri="$(printf '%s\n' "$sample_uri" | sed -E 's|https?://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu|g')"
            if [ "$rewritten_uri" != "$expected_uri" ]; then
              echo "::error::Ubuntu regional mirror rewrite regression: $rewritten_uri"
              exit 1
            fi
          done

          sudo sed -E -i 's|https?://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu|g' "$mirror_file"
          if grep -Eq 'https?://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu/?' "$mirror_file"; then
            echo "::error::A regional EC2 Ubuntu mirror remains configured."
            exit 1
          fi
          if ! grep -Eq 'https?://archive\.ubuntu\.com/ubuntu/?' "$mirror_file"; then
            echo "::error::The official Ubuntu archive mirror is not configured."
            exit 1
          fi

          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source_file" ]; then
              sudo sed -E -i 's|https?://[^[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done

          command -v xvfb-run >/dev/null
          command -v xauth >/dev/null
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --no-install-recommends -y mesa-vulkan-drivers ffmpeg

          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lvp_icd" ]; then
            echo "::error::Mesa Lavapipe Vulkan ICD is unavailable."
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"

      - name: Run focused camera controller regression
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/godot" --headless --path client-godot --audio-driver Dummy --script res://tests/camera_zoom_controller_regression.gd

      - name: Capture camera motion with fail-closed Mobile/Vulkan assertion
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/prompt-007-camera-evidence"
          stills="$evidence/stills"
          motion="$evidence/motion"
          mkdir -p "$stills" "$motion"

          IOM_VERTICAL_SLICE_OUTPUT_DIR="$stills" IOM_VERTICAL_SLICE_MOTION_DIR="$motion" \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$RUNNER_TEMP/godot/godot" \
              --path client-godot \
              --display-driver x11 \
              --rendering-method mobile \
              --rendering-driver vulkan \
              --audio-driver Dummy \
              --fixed-fps 30 \
              --script res://tests/render_vertical_slice_gameplay.gd 2>&1 | tee "$evidence/renderer.log"

          grep -Fx "IOM_RENDERER method=mobile driver=vulkan" "$evidence/renderer.log"
          grep -Eq '^PROMPT007_CAMERA_MOTION=PASS frames=90 distance=' "$evidence/renderer.log"
          if grep -Eiq 'ERROR:|failed to compile shader' "$evidence/renderer.log"; then
            echo "::error::Godot reported an engine or shader error during camera capture."
            exit 1
          fi

          for name in vertical-slice-gameplay.png vertical-slice-gameplay-orbited.png vertical-slice-gameplay-drawer.png vertical-slice-player-closeup-idle.png vertical-slice-player-closeup-walk.png; do
            test -s "$stills/$name"
            file "$stills/$name"
          done

          frame_count="$(find "$motion" -maxdepth 1 -type f -name 'walk_*.png' | wc -l)"
          test "$frame_count" -eq 90
          unique_frames="$(sha256sum "$motion"/walk_*.png | awk '{print $1}' | sort -u | wc -l)"
          test "$unique_frames" -gt 1
          (cd "$motion" && sha256sum walk_*.png > MOTION-FRAME-SHA256SUMS)
          (cd "$motion" && sha256sum -c MOTION-FRAME-SHA256SUMS)
          test "$(wc -l < "$motion/MOTION-FRAME-SHA256SUMS")" -eq 90

          video="$evidence/vertical-slice-camera-motion.mp4"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -framerate 30 -i "$motion/walk_%03d.png" -frames:v 90 \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart "$video"

          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")"
          rate="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$video")"
          encoded="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$video")"
          test "$width" = "1280"
          test "$height" = "720"
          test "$rate" = "30/1"
          test "$encoded" -eq 90

          actual_source_sha="$(git rev-parse HEAD)"
          test "$actual_source_sha" = "$SOURCE_SHA"
          sha256sum \
            client-godot/gameplay/touch_controls.gd \
            client-godot/gameplay/vertical_slice.tscn \
            client-godot/gameplay/vertical_slice_world.gd \
            client-godot/scripts/camera_terrain_collision_factory.gd \
            client-godot/scripts/camera_zoom_controller.gd \
            client-godot/scripts/rendering_evidence_guard.gd \
            client-godot/tests/camera_zoom_controller_regression.gd \
            client-godot/tests/render_vertical_slice_gameplay.gd \
            > "$evidence/SOURCE-FILES-SHA256SUMS"

          video_sha="$(sha256sum "$video" | cut -d' ' -f1)"
          camera_sha="$(sha256sum client-godot/scripts/camera_zoom_controller.gd | cut -d' ' -f1)"
          scene_sha="$(sha256sum client-godot/gameplay/vertical_slice.tscn | cut -d' ' -f1)"
          motion_assertion="$(grep -E '^PROMPT007_CAMERA_MOTION=PASS ' "$evidence/renderer.log")"

          cat > "$evidence/PROMPT007-CAPTURE-PROVENANCE.json" <<EOF
          {
            "code_sha": "$actual_source_sha",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "godot_version": "4.7.2.stable",
            "renderer_method": "mobile",
            "renderer_driver": "vulkan",
            "device": "GitHub Actions Ubuntu 24.04 / Mesa Lavapipe software Vulkan",
            "scene": "res://gameplay/vertical_slice.tscn",
            "capture_script": "res://tests/render_vertical_slice_gameplay.gd",
            "camera_script_sha256": "$camera_sha",
            "scene_sha256": "$scene_sha",
            "capture_file": "vertical-slice-camera-motion.mp4",
            "capture_sha256": "$video_sha",
            "width": 1280,
            "height": 720,
            "fps": 30,
            "frames": 90,
            "motion_frames_directory": "motion",
            "motion_frame_hash_manifest": "motion/MOTION-FRAME-SHA256SUMS",
            "camera_motion_assertion": "$motion_assertion",
            "new_source_assets": [],
            "existing_asset_provenance": "NOT_VERIFIED_BY_THIS_CAMERA_PR",
            "visual_parity": "FAIL",
            "physical_device_validation": "NOT_VERIFIED",
            "classification": "DIAGNOSTIC_ONLY_NOT_PREMIUM_VISUAL_ACCEPTANCE"
          }
          EOF
          python3 -m json.tool "$evidence/PROMPT007-CAPTURE-PROVENANCE.json" >/dev/null
          (cd "$evidence" && sha256sum renderer.log vertical-slice-camera-motion.mp4 PROMPT007-CAPTURE-PROVENANCE.json SOURCE-FILES-SHA256SUMS motion/MOTION-FRAME-SHA256SUMS motion/walk_*.png stills/*.png > SHA256SUMS)
          (cd "$evidence" && sha256sum -c SHA256SUMS)

      - name: Upload internal diagnostic camera-motion evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: prompt-007-camera-motion-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/prompt-007-camera-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
