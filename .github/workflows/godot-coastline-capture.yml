name: Godot coastline visual capture

on:
  pull_request:
    paths:
      - "client-godot/**"
      - ".github/workflows/godot-coastline-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install verified Godot 4.7.2 and display runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
      - name: Capture tested shoreline geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coastline-evidence"
          xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --editor --path client-godot --quit --import
          "$RUNNER_TEMP/godot" --headless --path client-godot --script res://tests/coast_geometry_check.gd
          IOM_SCREENSHOT_PATH="$RUNNER_TEMP/coastline-evidence/coastline.png" xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/godot" --path client-godot --rendering-method gl_compatibility --script res://tests/coastline_capture.gd
          test -s "$RUNNER_TEMP/coastline-evidence/coastline.png"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: real-godot-coastline
          path: ${{ runner.temp }}/coastline-evidence/
          if-no-files-found: error

