name: Stage Poly Haven coastal PBR candidate

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Pre-screened CC0 coastal texture"
        required: true
        type: choice
        options:
          - aerial_beach_01
          - coast_sand_rocks_02
          - seaside_rock

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Stage candidate PBR maps with SHA-256 evidence
        env:
          IOM_STAGE_DIR: ${{ runner.temp }}/coastal-stage
          ASSET_ID: ${{ inputs.asset }}
        run: python3 scripts/stage-polyhaven-coast.py "$ASSET_ID"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: coastal-pbr-candidate
          path: ${{ runner.temp }}/coastal-stage/
          if-no-files-found: error
