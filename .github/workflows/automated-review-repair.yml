name: Automated review and repair controller

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, "Static Security Quality", "Performance Acceptance", "CodeQL Advanced", "Codacy Security Scan", "Godot visual evidence", "IOM-00 Godot client", "IOM-07 mobile frame evidence"]
    types: [completed]
  workflow_dispatch:
    inputs:
      repair:
        description: "Run the authenticated repair worker (requires repository setup)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: automated-review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.ref }}-${{ github.event.review.id || github.event.comment.id || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify and deduplicate event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Derive immutable event key
        id: event
        env:
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          key="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { eventKey } from "./scripts/review-controller.mjs"; const e=JSON.parse(readFileSync(process.env.EVENT_PATH,"utf8")); process.stdout.write(eventKey({...e,eventName:process.env.EVENT_NAME}));')"
          test "${#key}" -eq 64
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Validate controller contracts
        run: npm run test:review-controller
      - name: Record fail-closed event decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "${HEAD_SHA}" != "" && test "${#HEAD_SHA}" -eq 40
          echo "Event ${EVENT_NAME}/${EVENT_ACTION} classified against exact head ${HEAD_SHA}."
          echo "No repair or merge is performed by this read-only classifier."

  repair:
    name: Authenticated Codex repair (gated)
    if: github.event_name == 'workflow_dispatch' && inputs.repair == true
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse until explicit worker setup exists
        env:
          CODEX_REPAIR_TOKEN: ${{ secrets.CODEX_REPAIR_TOKEN }}
          CODEX_REPAIR_COMMAND: ${{ vars.CODEX_REPAIR_COMMAND }}
        run: |
          set -euo pipefail
          test -n "$CODEX_REPAIR_TOKEN" || { echo "CODEX_REPAIR_TOKEN is not configured; repair worker remains inactive."; exit 1; }
          test -n "$CODEX_REPAIR_COMMAND" || { echo "CODEX_REPAIR_COMMAND is not configured; repair worker remains inactive."; exit 1; }
          echo "Worker credentials are configured, but this repository does not execute arbitrary repair commands from workflow input."
          echo "Replace this guarded step with the approved Codex worker action after security review."
          exit 1
