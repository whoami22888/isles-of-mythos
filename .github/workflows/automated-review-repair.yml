name: Automated review and repair controller

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, "Static Security Quality", "Performance Acceptance", "CodeQL Advanced", "Codacy Security Scan", "Godot visual evidence", "IOM-00 Godot client", "IOM-07 mobile frame evidence"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: automated-review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.ref }}-${{ github.event.review.id || github.event.comment.id || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify and deduplicate event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Classify actual event, fail closed for irrelevant or incomplete payloads
        id: event
        env:
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { shouldProcess } from './scripts/review-controller.mjs';
          const event = JSON.parse(readFileSync(process.env.EVENT_PATH, 'utf8'));
          const decision = shouldProcess({ ...event, eventName: process.env.EVENT_NAME });
          appendFileSync(process.env.GITHUB_OUTPUT,
            `key=${decision.key}\nrelevant=${decision.process ? 'true' : 'false'}\nreason=${decision.reason ?? 'relevant'}\n`);
          console.log(`Controller event: ${decision.process ? 'relevant' : 'ignored'} (${decision.reason ?? decision.kind})`);
          NODE
      - name: Validate controller contracts
        run: npm run test:review-controller
      - name: Record read-only decision for relevant event
        if: steps.event.outputs.relevant == 'true'
        env:
          EVENT_KEY: ${{ steps.event.outputs.key }}
        run: |
          test "${#EVENT_KEY}" -eq 64
          echo "Relevant event classified. No repair or merge performed."
      - name: Report safely ignored event
        if: steps.event.outputs.relevant != 'true'
        run: echo "Irrelevant or incomplete event ignored; no repair or merge."
