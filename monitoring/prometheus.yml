global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: isles-server
    metrics_path: /metrics
    static_configs:
      - targets: ["server:3000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
